<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guys… Treat? 😋</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg1: #ffe5b4;
      --bg2: #fff3dc;
      --card: #ffffffcc;
      --no: #22c55e;
      --noHover: #16a34a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family: system-ui, sans-serif;
      overflow: hidden;
      padding: 16px;
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
    }

    .card {
      width: min(720px, 92vw);
      padding: 26px 22px;
      background: var(--card);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.15);
    }

    .art {
      font-size: 96px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(26px, 4vw, 42px);
      margin-bottom: 18px;
    }

    .button-zone {
      position: relative;
      width: min(520px, 92%);
      height: 150px;
      margin: 0 auto;
    }

    button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 16px 24px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
    }

    #noBtn {
      left: 20%;
      background: var(--no);
      color: #fff;
    }

    #noBtn:hover { background: var(--noHover); }

    #yesBtn {
      left: 60%;
      background: #e5e7eb;
      color: #111827;
    }

    .hint {
      margin-top: 10px;
      font-size: 13px;
      opacity: .7;
    }

    .result {
      display: none;
      margin-top: 18px;
      animation: pop .35s ease;
    }

    .result h2 {
      font-size: clamp(28px, 4.5vw, 44px);
      margin-bottom: 14px;
    }

    @keyframes pop {
      from { transform: scale(.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body>
<canvas id="confettiCanvas"></canvas>

<main class="card">
  <div class="art" id="art">🍕🍔🍰</div>

  <h1 id="question">Guys… Treat Veno?? 😋</h1>

  <section class="button-zone" id="zone">
    <button id="noBtn">No 🙅‍♂️</button>
    <button id="yesBtn">Yes 😋</button>
  </section>

  <div class="hint" id="hint">Think carefully… wallet matters 😌</div>

  <section class="result" id="result">
    <h2>
      As you wish 😌  
      <br>Next time pakka though 😉
    </h2>
  </section>
</main>

<script>
  const zone = document.getElementById("zone");
  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");
  const result = document.getElementById("result");
  const hint = document.getElementById("hint");
  const art = document.getElementById("art");
  const question = document.getElementById("question");
  const confettiCanvas = document.getElementById("confettiCanvas");

  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    confettiCanvas.width = innerWidth * dpr;
    confettiCanvas.height = innerHeight * dpr;
  }

  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);

  const confettiInstance = confetti.create(confettiCanvas, {
    resize: false,
    useWorker: true
  });

  function fireConfetti() {
    const end = Date.now() + 1200;
    (function frame() {
      confettiInstance({
        particleCount: 12,
        spread: 120,
        startVelocity: 45,
        origin: { x: Math.random(), y: Math.random() * 0.4 }
      });
      if (Date.now() < end) requestAnimationFrame(frame);
    })();
  }

  function clamp(n, min, max) {
    return Math.max(min, Math.min(max, n));
  }

  function moveYes(px, py) {
    const z = zone.getBoundingClientRect();
    const b = yesBtn.getBoundingClientRect();

    let dx = (b.left + b.width / 2) - px;
    let dy = (b.top + b.height / 2) - py;
    let mag = Math.hypot(dx, dy) || 1;
    dx /= mag;
    dy /= mag;

    let newLeft = (b.left - z.left) + dx * 150;
    let newTop  = (b.top - z.top) + dy * 150;

    yesBtn.style.left = clamp(newLeft, 0, z.width - b.width) + "px";
    yesBtn.style.top  = clamp(newTop, 0, z.height - b.height) + "px";
    yesBtn.style.transform = "none";
  }

  zone.addEventListener("pointermove", e => {
    const b = yesBtn.getBoundingClientRect();
    const d = Math.hypot(
      (b.left + b.width / 2) - e.clientX,
      (b.top + b.height / 2) - e.clientY
    );
    if (d < 140) moveYes(e.clientX, e.clientY);
  });

  noBtn.addEventListener("click", () => {
    zone.style.display = "none";
    hint.style.display = "none";
    art.style.display = "none";
    question.style.display = "none";
    result.style.display = "block";
    fireConfetti();
  });
</script>
</body>
</html>
